<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Commander.js core type relationships">
  <defs>
    <marker id="ovw-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" fill-opacity="0.7"/>
    </marker>
    <marker id="ovw-arrow-err" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9b2c2c" fill-opacity="0.85"/>
    </marker>
  </defs>
  <style>
    .ovw-node { fill: none; stroke: currentColor; stroke-opacity: 0.55; stroke-width: 1.3; }
    .ovw-node-accent { stroke: #2b6cb0; stroke-opacity: 0.9; stroke-width: 1.6; }
    .ovw-node-err { stroke: #9b2c2c; stroke-opacity: 0.7; stroke-width: 1.2; }
    .ovw-edge { stroke: currentColor; stroke-opacity: 0.55; stroke-width: 1.2; fill: none; }
    .ovw-edge-err { stroke: #9b2c2c; stroke-opacity: 0.7; stroke-width: 1.1; stroke-dasharray: 5 3; fill: none; }
    .ovw-edge-self { stroke: currentColor; stroke-opacity: 0.45; stroke-width: 1.1; fill: none; }
    .ovw-label { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 14px; fill: currentColor; font-weight: 600; }
    .ovw-label-err { fill: #9b2c2c; }
    .ovw-edge-label { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 11px; fill: currentColor; fill-opacity: 0.7; }
    .ovw-edge-label-err { fill: #9b2c2c; fill-opacity: 0.85; }
  </style>
  <rect class="ovw-node ovw-node-accent" x="280" y="135" width="160" height="50" rx="6"/>
  <text class="ovw-label" x="360" y="166" text-anchor="middle">Command</text>
  <rect class="ovw-node" x="60" y="135" width="120" height="50" rx="6"/>
  <text class="ovw-label" x="120" y="166" text-anchor="middle">Option</text>
  <rect class="ovw-node" x="60" y="225" width="120" height="50" rx="6"/>
  <text class="ovw-label" x="120" y="256" text-anchor="middle">Argument</text>
  <rect class="ovw-node" x="540" y="135" width="120" height="50" rx="6"/>
  <text class="ovw-label" x="600" y="166" text-anchor="middle">Help</text>
  <rect class="ovw-node ovw-node-err" x="280" y="245" width="160" height="50" rx="6"/>
  <text class="ovw-label ovw-label-err" x="360" y="276" text-anchor="middle">CommanderError</text>
  <line class="ovw-edge" x1="280" y1="153" x2="185" y2="153" marker-end="url(#ovw-arrow)"/>
  <text class="ovw-edge-label" x="232" y="146" text-anchor="middle">has many</text>
  <path class="ovw-edge" d="M 280 175 L 240 175 L 240 240 L 185 240" marker-end="url(#ovw-arrow)"/>
  <text class="ovw-edge-label" x="232" y="218" text-anchor="middle">has many</text>
  <line class="ovw-edge" x1="445" y1="160" x2="535" y2="160" marker-end="url(#ovw-arrow)"/>
  <text class="ovw-edge-label" x="490" y="153" text-anchor="middle">renders via</text>
  <path class="ovw-edge-err" d="M 120 190 L 120 215 L 280 260" marker-end="url(#ovw-arrow-err)"/>
  <text class="ovw-edge-label ovw-edge-label-err" x="195" y="234">throws</text>
  <path class="ovw-edge-err" d="M 180 252 L 270 260" marker-end="url(#ovw-arrow-err)"/>
  <text class="ovw-edge-label ovw-edge-label-err" x="220" y="248">throws</text>
  <path class="ovw-edge-self" d="M 425 135 C 470 95 470 60 360 60 C 250 60 250 95 295 135" marker-end="url(#ovw-arrow)"/>
  <text class="ovw-edge-label" x="360" y="55" text-anchor="middle">registers child</text>
</svg>
